name: Defeito
description: Relatar um comportamento incorreto.
title: "[bug] "
labels:
  - type:bug
body:
  - type: markdown
    attributes:
      value: |
        Não inclua saldo, descrição de transação, número de conta, exportação ou outra informação financeira pessoal.
  - type: textarea
    id: actual
    attributes:
      label: O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que deveria acontecer?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir com dados fictícios?
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Dispositivo e versão do Android
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Mensagens técnicas sem dados pessoais
      description: Remova qualquer valor, conta, nome, caminho pessoal, token ou chave antes de colar logs.
